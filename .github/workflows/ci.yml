# Runs every automatic check on each push and pull request, so a change that
# breaks the game, its browser pages or the brain service shows up as a red
# mark instead of in a playtest.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The web game: lint, production build, Node unit tests and the real-asset
  # browser pages in headless Chromium with software WebGL (no GPU needed).
  node:
    name: Game build, unit tests and browser pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install packages exactly as locked
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Install headless Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser test pages
        run: pnpm test:browser

  # The local brain service with the committed checkpoint, on the exact Python
  # packages it was saved with (requirements-brain.txt).
  python:
    name: Brain service and checkpoint tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-brain.txt

      # CPU-only PyTorch from the PyTorch index skips gigabytes of CUDA libraries.
      - name: Install CPU PyTorch and the pinned brain packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-brain.txt

      # Fail here, rather than skip the real-brain tests, if the stack is incomplete.
      - name: Check the brain can be imported
        run: python -c "import torch, sb3_contrib, gymnasium; print('torch', torch.__version__)"

      - name: Frozen recipe, brain, HTTP and speed-up tests (real checkpoint)
        run: >-
          python -m unittest -v
          tests/test_frozen_recipe.py
          tests/test_junkyard_brain.py
          tests/test_eye_vision.py
          tests/test_junkyard_server.py
          tests/test_junkyard_speedups.py
